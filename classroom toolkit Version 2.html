h:min(900px,94vw);max-height:92dvh;background:var(--bg)}dialog::backdrop{background:#2714358c}dialog .dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}dialog .dialog-head h2{margin:0}.qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:18px}.qr-card{background:white;border:1px solid var(--line);padding:18px;border-radius:14px;text-align:center}.qr-image{width:176px;min-height:176px;margin:12px auto}.qr-card a{display:block;font-size:14px;color:var(--purple);overflow-wrap:anywhere}.wheel-layout{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}.wheel-wrap{width:300px;max-width:100%;margin:0 auto;position:relative;padding-top:22px}.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:28px;color:var(--pink);z-index:2;line-height:1}.wheel{width:284px;height:284px;max-width:100%;border-radius:50%;border:7px solid white;box-shadow:0 0 0 2px #cfb8dd,0 12px 25px #7034a826;position:relative;transition:transform 1.6s cubic-bezier(.18,.75,.2,1)}.wheel:after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:35px;height:35px;border:5px solid var(--purple);background:white;border-radius:50%}.wheel span{position:absolute;top:50%;left:50%;font-size:16px;font-weight:850;color:white}.wheel-result{text-align:center;font-size:23px;color:var(--pink);font-weight:850;min-height:40px;margin:18px 0 8px}.clock{font-size:76px;font-variant-numeric:tabular-nums;text-align:center;font-weight:850;color:var(--purple)}.clock.warn{color:#b46200}.clock.over{color:var(--pink)}.message{padding:10px 24px;background:#fce7f0;color:#86204d;font-size:14px;position:fixed;bottom:0;left:0;right:0;z-index:10}.message:empty{display:none}[hidden]{display:none!important}.busy-note{font-size:14px;color:var(--muted)}#groupNames{width:100%}#boot{padding:30px;text-align:center}#namesStatus{max-height:120px;overflow:auto;margin-top:12px}.quiet{ </head><body>
<header class="header"><div class="brand"><div class="mark">EP</div><div><h1>Ms. Elsa Phương Nguyễn</h1><div class="sub">Classroom Engagement Toolkit · V2</div></div></div><div id="teacherHeader" hidden class="row"><span class="pill">Teacher Dashboard</span><button id="logout" class="soft">Đăng xuất</button></div></header>
<div id="boot">Đang kết nối… Nếu chờ lâu, hãy kiểm tra Internet và tải lại trang.</div>
<section id="login" class="login" hidden><h2>Đăng nhập giảng viên</h2><p class="note">Sử dụng tài khoản giảng viên đã tạo trong Firebase.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" id="loginButton">Mở Teacher Dashboard</button></form><p id="loginMsg" role="status" class="note"></p></section>
<template id="teacherTemplate">
<main id="teacher"><div class="workspace"><section class="panel score-panel"><div class="row between"><h2>Nhóm và bảng điểm</h2><span class="pill" id="groupTotal"></span></div><div class="row"><label for="groupCount">Số nhóm</label><input id="groupCount" type="number" min="1" max="20" value="3"><button id="generateGroups">Tạo nhóm</button></div><p class="note quiet">Nhấp thẻ nhóm: +1 điểm · Nút −: trừ 1 điểm</p><div id="groups" class="groups"></div><div class="row"><button id="editNames" class="soft">Sửa tên nhóm</button><button id="showQR" class="soft">QR từng nhóm</button><span class="note" id="rankSummary"></span></div></section>
<section class="panel buzzer-panel"><div class="row between"><h2>Bấm nhanh giành quyền</h2><span class="pill" id="roundLabel">Sẵn sàng</span></div><div class="buzzer-actions"><button id="openRound">Mở lượt trả lời</button><button id="nextRound" class="pink">Bắt đầu lượt mới</button></div><div class="result" id="resultPanel" aria-live="polite"><span class="note" id="resultState">Trạng thái lượt</span><h3 id="result">Chưa mở lượt trả lời</h3><span id="resultDetail" class="note"></span></div><div class="buzzer-foot"><button id="award" disabled>Đúng +1 điểm</button><button id="closeRound" class="soft">Đóng lượt</button></div><p class="note quiet">Lượt mới xóa kết quả đang hiển thị, giữ nguyên tên nhóm và điểm; bấm Mở lượt để bắt đầu nhận tín hiệu.</p></section></div>
<footer class="toolbar"><button id="showWheel" class="soft">Vòng quay chọn nhóm</button><button id="showTimer" class="soft">Đồng hồ <span id="miniClock">05:00</span></button><button id="showHistory" class="soft">Lịch sử lượt bấm</button><span class="statusbar" id="connection">Đang kết nối Firebase…</span></footer></main>
<dialog id="qrDialog"><div class="dialog-head"><h2>QR riêng cho từng nhóm</h2><button data-close class="soft">Đóng</button></div><form id="qrForm"><label for="studentURL">Link website GitHub Pages đang chạy</label><div class="row"><input style="flex:1;min-width:200px" id="studentURL" type="url" placeholder="https://ten-cua-co.github.io/ten-repository/" required><button id="makeQR">Tạo QR</button></div></form><p class="note" id="qrStatus">Dán link website, không phải link trang quản lý repository trên github.com.</p><div class="qr-grid" id="qrGroups"></div></dialog>
<dialog id="wheelDialog"><div class="dialog-head"><h2>Vòng quay chọn nhóm</h2><button data-close class="soft">Đóng</button></div><div class="wheel-layout"><div><label for="groupNames">Tên nhóm — mỗi dòng một nhóm</label><textarea id="groupNames" rows="6" maxlength="1220"></textarea><button id="saveNames">Cập nhật tên nhóm</button><p class="note" id="namesStatus"></p></div><div><div class="wheel-wrap"><div class="pointer">▼</div><div class="wheel" id="wheel"></div></div><div id="wheelWinner" class="wheel-result">Chưa quay</div><div style="text-align:center"><button class="pink" id="spin">QUAY</button></div></div></div></dialog>
<dialog id="timerDialog"><div class="dialog-head"><h2>Đồng hồ đếm ngược</h2><button data-close class="soft">Đóng</button></div><div id="clock" class="clock">05:00</div><div class="row" style="justify-content:center"><label>Phút <input id="minutes" type="number" min="0" max="999" value="5"></label><label>Giây <input id="seconds" type="number" min="0" max="59" value="0"></label><button id="startTimer">Bắt đầu</button><button id="resetTimer" class="soft">Đặt lại</button></div><p class="note" style="text-align:center;margin-top:18px">Đồng hồ tiếp tục chạy khi đóng cửa sổ này.</p></dialog>
<dialog id="historyDialog"><div class="dialog-head"><h2>Lịch sử 10 lượt bấm gần nhất</h2><button data-close class="soft">Đóng</button></div><div id="history" class="history"></div></dialog>
</template>
<section id="student" class="student" hidden><span class="pill">Student Buzzer</span><h2 style="margin-top:16px" id="studentGroup">Đang xác định nhóm…</h2><label for="studentName">Họ và tên sinh viên</label><input id="studentName" maxlength="80" autocomplete="name" placeholder="Nhập họ và tên" required><button id="buzz" class="bigbuzz" disabled>BẤM<br>NGAY</button><div id="studentMsg" class="student-msg" role="status">Đang kết nối…</div><p id="studentConnection" class="note"></p></section>
<div class="message" id="message" role="alert"></div><noscript>Ứng dụng cần bật JavaScript trong trình duyệt.</noscript>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';

const firebaseConfig={apiKey:'AIzaSyBPi-9q-mnRDGuKyhzJwrm4hUz7AqG2AuM',authDomain:'elsa-classroom-buzzer.firebaseapp.com',databaseURL:'https://elsa-classroom-buzzer-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'elsa-classroom-buzzer',storageBucket:'elsa-classroom-buzzer.firebasestorage.app',messagingSenderId:'726710659924',appId:'1:726710659924:web:24aa673f435d83c48536c1'};
// A separate Auth instance keeps a teacher testing a student QR from using teacher credentials.
const app=initializeApp(firebaseConfig,window.studentMode?'elsa-student-v2':'elsa-teacher-v2');
const auth=getAuth(app),db=getDatabase(app),$=s=>document.querySelector(s),params=new URLSearchParams(location.search);
let connected=false,owner='',room=null,groups={},round=null,winner=null,teacherReady=false,busy=false,spinning=false,rotation=0;
let studentGroup='',studentToken='',studentPending=false,studentSent='',winnerUnsubscribe=null,studentWinnerReady=false;
const token=()=>Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>b.toString(16).padStart(2,'0')).join('');

const entries=()=>Object.entries(groups).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
function notify(s){$('#message').textContent=s}

async function action(fn){if(!connected)return notify('Đang mất kết nối; hãy đợi kết nối lại rồi thao tác.');if(busy)return;busy=true;renderControls();notify('');try{await fn()}catch(e){notify(explain(e))}finally{busy=false;renderControls()}}
function button(label,fn,cls='soft'){const b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls;b.onclick=fn;return b}
function renderControls(){if(!teacherReady)return;$('#openRound').disabled=busy||!connected||!!winner||round?.status==='OPEN';$('#nextRound').disabled=busy||!connected;$('#closeRound').disabled=busy||!connected||round?.status!=='OPEN';$('#award').disabled=busy||!connected||!winner||!!room?.awards?.[round?.id];$('#award').textContent=room?.awards?.[round?.id]?'Đã cộng +1 điểm':'Đúng +1 điểm';$('#generateGroups').disabled=busy||!connected||spinning;$('#saveNames').disabled=busy||!connected||spinning;$('#spin').disabled=spinning||!entries().length;}
onValue(ref(db,'.info/connected'),s=>{connected=s.val()===true;if($('#connection'))$('#connection').textContent=connected?'Đã kết nối · Tự lưu trên Firebase':'Mất kết nối · Tạm dừng thao tác';if($('#studentConnection'))$('#studentConnection').textContent=connected?'Đã kết nối':'Mất kết nối · Chờ mạng trở lại';renderControls();syncStudent()});
function renderTeacher(){groups=room?.groups||{};round=room?.round||null;winner=room?.claims?.[round?.id]||null;const list=entries();$('#groupTotal').textContent=list.length+' nhóm';$('#groupCount').value=list.length;const container=$('#groups'),scroll=container.scrollTop;container.classList.toggle('dense',list.length>7);container.classList.toggle('many',list.length>12);container.replaceChildren();list.forEach(([id,g])=>{const card=document.createElement('div');card.className='group';const add=button('',e=>{e.stopPropagation();changeScore(id,1)},'group-main');const name=document.createElement('span');name.className='group-name';name.textContent=g.name;const score=document.createElement('span');score.className='score';score.textContent=g.score||0;add.append(name,score);add.setAttribute('aria-label',g.name+': '+(g.score||0)+' điểm. Cộng 1 điểm');const minus=button('−',e=>{e.stopPropagation();changeScore(id,-1)},'minus');minus.setAttribute('aria-label','Trừ 1 điểm '+g.name);card.onclick=()=>changeScore(id,1);card.append(add,minus);container.append(card)});container.scrollTop=scroll;
const best=list.reduce((a,b)=>!a||b[1].score>a[1].score?b:a,null);$('#rankSummary').textContent=best?'Dẫn đầu: '+best[1].name:'';
if(document.activeElement!==$('#groupNames'))$('#groupNames').value=list.map(([,g])=>g.name).join('\n');$('#namesStatus').textContent=list.map(([,g],i)=>(i+1)+': '+g.name).join(' · ');if(!spinning)drawWheel();
$('#roundLabel').textContent=winner?'Đã khóa lượt':round?.status==='OPEN'?'Đang mở':'Đang đóng';$('#resultPanel').classList.toggle('open',round?.status==='OPEN'&&!winner);$('#resultState').textContent=winner?'Đã nhận người giành quyền':'Trạng thái lượt';$('#result').textContent=winner?winner.studentName+' — '+(groups[winner.group]?.name||'Nhóm đã xóa'):round?.status==='OPEN'?'Đang nhận tín hiệu…':'Chưa mở lượt trả lời';$('#resultDetail').textContent=winner?'Firebase ghi nhận lúc '+new Date(winner.timestamp).toLocaleTimeString('vi-VN'):'Sinh viên nhập tên trên điện thoại trước khi bấm.';renderControls();}
function changeScore(id,delta){action(async()=>{await runTransaction(roomRef('groups/'+id+'/score'),n=>(Number(n)||0)+delta,{applyLocally:false})})}
async function saveGroups(names){if(spinning)return;if(!names.length||names.length>20||names.some(x=>!x||x.length>60))return notify('Nhập 1–20 nhóm; mỗi tên từ 1 đến 60 ký tự.');const old=entries();if(names.length<old.length&&!confirm('Giảm số nhóm sẽ bỏ điểm và QR của các nhóm cuối. Tiếp tục?'))return;

function drawWheel(){const list=entries(),colors=['#bd286f','#7034a8','#d45b98','#986ac7'];const wheel=$('#wheel');wheel.style.background=list.length?'conic-gradient('+list.map((_,i)=>colors[i%4]+' '+i/list.length*100+'% '+(i+1)/list.length*100+'%').join(',')+')':'#eee';wheel.replaceChildren();list.forEach((_,i)=>{const label=document.createElement('span');label.textContent=i+1;label.style.transform='translate(-50%,-50%) rotate('+((i+.5)*360/list.length)+'deg) translateY(-110px)';wheel.append(label)})}
function show(id){$('#'+id).showModal()}
function bindTeacher(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('#generateGroups').onclick=()=>{const n=Number($('#groupCount').value);if(!Number.isInteger(n)||n<1||n>20)return notify('Số nhóm phải là số nguyên từ 1 đến 20.');const old=entries();saveGroups(Array.from({length:n},(_,i)=>old[i]?.[1].name||'Nhóm '+(i+1)))};$('#saveNames').onclick=()=>saveGroups($('#groupNames').value.split('\n').map(s=>s.trim()).filter(Boolean));$('#editNames').onclick=()=>{show('wheelDialog');$('#groupNames').focus()};$('#showWheel').onclick=()=>show('wheelDialog');$('#showTimer').onclick=()=>show('timerDialog');$('#showQR').onclick=()=>show('qrDialog');$('#showHistory').onclick=()=>{const h=$('#history');h.replaceChildren();Object.entries(room.claims||{}).sort((a,b)=>b[1].timestamp-a[1].timestamp).slice(0,10).forEach(([id,w])=>{const p=document.createElement('p');p.textContent=new Date(w.timestamp).toLocaleString('vi-VN')+' · '+w.studentName+' — '+(groups[w.group]?.name||'Nhóm đã xóa')+(room.awards?.[id]?' · Đã cộng +1':'');h.append(p)});if(!h.children.length)h.textContent='Chưa có kết quả bấm.';show('historyDialog')};
$('#openRound').onclick=()=>action(async()=>{await runTransaction(roomRef('round'),r=>{if(!r||r.status==='OPEN')return;return {...r,status:'OPEN'}},{applyLocally:false})});$('#nextRound').onclick=()=>action(async()=>{await set(roomRef('round'),{id:token(),status:'RESET'})});$('#closeRound').onclick=()=>action(async()=>{await update(roomRef('round'),{status:'CLOSED'})});
$('#award').onclick=()=>action(async()=>{const id=round.id;await runTransaction(roomRef(),r=>{if(!r||r.round?.id!==id||r.awards?.[id]||!r.claims?.[id])return;const g=r.claims[id].group;if(!r.groups?.[g])return;r.groups[g].score=(Number(r.groups[g].score)||0)+1;r.awards={...r.awards,[id]:true};return r},{applyLocally:false})});
$('#studentURL').value=location.origin+location.pathname;$('#qrForm').onsubmit=e=>{e.preventDefault();makeQR()};$('#spin').onclick=()=>{if(spinning)return;const list=entries();if(!list.length)return;spinning=true;renderControls();const rand=crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;const i=Math.floor(rand*list.length),target=360-(i+.5)*360/list.length;rotation+=1800+(target-rotation%360+360)%360;$('#wheel').style.transform='rotate('+rotation+'deg)';$('#wheelWinner').textContent='Đang quay…';setTimeout(()=>{$('#wheelWinner').textContent=list[i][1].name;spinning=false;drawWheel();renderControls()},1650)};bindTimer();}
function makeQR(){try{const u=new URL($('#studentURL').value.trim());if(u.protocol!=='https:'||u.hostname==='github.com'||u.hostname==='www.github.com')throw Error('Dùng link website HTTPS GitHub Pages, không dùng link repository trên github.com.');if(typeof QRCode==='undefined')throw Error('Chưa tải được thư viện QR. Kiểm tra mạng rồi tải lại trang.');u.search='';u.hash='';const parent=$('#qrGroups');parent.replaceChildren();entries().forEach(([id,g])=>{const invite=Object.entries(room.invites||{}).find(([,v])=>v===id)?.[0];if(!invite)throw Error('Thiếu mã nhóm. Hãy cập nhật danh sách nhóm trước.');const url=new URL(u);url.searchParams.set('role','student');url.searchParams.set('room',owner);url.searchParams.set('group',id);url.searchParams.set('token',invite);const card=document.createElement('div');card.className='qr-card';const name=document.createElement('strong');name.textContent=g.name;const qr=document.createElement('div');qr.className='qr-image';const link=document.createElement('a');link.href=url.href;link.target='_blank';link.rel='noopener';link.textContent='Mở Student Buzzer — '+g.name;card.append(name,qr,link);parent.append(card);new QRCode(qr,{text:url.href,width:176,height:176,correctLevel:QRCode.CorrectLevel.M})});$('#qrStatus').textContent='Quét QR → nhập tên → chờ mở lượt → bấm. Mỗi QR chỉ mở Student Buzzer.'}catch(e){$('#qrStatus').textContent=e.message}}
function bindTimer(){let remaining=300,running=false,started=false,deadline=0,interval=null;let audio=null;const duration=()=>{const m=+$('#minutes').value,s=+$('#seconds').value;return Number.isInteger(m)&&m>=0&&m<=999&&Number.isInteger(s)&&s>=0&&s<=59?m*60+s:null};const paint=()=>{const txt=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('#clock').textContent=txt;$('#miniClock').textContent=txt;$('#clock').classList.toggle('warn',remaining>0&&remaining<=30);$('#clock').classList.toggle('over',remaining===0);$('#startTimer').textContent=running?'Tạm dừng':started&&remaining>0?'Tiếp tục':'Bắt đầu'};const alarm=()=>{try{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=740;g.gain.value=.12;o.start();o.stop(audio.currentTime+.8)}catch{}};const tick=()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!remaining){running=false;started=false;clearInterval(interval);alarm();notify('Đã hết thời gian.')}paint()};$('#startTimer').onclick=()=>{if(running){tick();running=false;clearInterval(interval);paint();return}if(!started){const n=duration();if(n===null||n===0)return notify('Nhập thời gian hợp lệ, lớn hơn 0.');remaining=n}try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}started=true;running=true;deadline=Date.now()+remaining*1000;interval=setInterval(tick,200);paint()};$('#resetTimer').onclick=()=>{const n=duration();if(n===null)return notify('Phút 0–999; giây 0–59.');clearInterval(interval);remaining=n;running=false;started=false;paint()};paint()}
async function startTeacher(user){try{await get(ref(db,'teacherAccess'));owner=user.uid;let snapshot=await get(roomRef());if(!snapshot.exists()){const initialGroups={},invites={};['Nhóm Amazon','Nhóm Shopee','Nhóm TikTok Shop'].forEach((name,i)=>{const id='g_'+token();initialGroups[id]={name,score:0,order:i};invites[token()]=id});await runTransaction(roomRef(),r=>r||{groups:initialGroups,invites,round:{id:token(),status:'RESET'}},{applyLocally:false})}$('#login').hidden=true;$('#teacherHeader').hidden=false;document.body.append($('#teacherTemplate').content.cloneNode(true));teacherReady=true;bindTeacher();onValue(roomRef(),s=>{room=s.val();renderTeacher()},e=>{teacherReady=false;$('#teacher').hidden=true;notify(explain(e))});$('#connection').textContent=connected?'Đã kết nối · Tự lưu trên Firebase':'Đang kết nối Firebase…'}catch(e){$('#login').hidden=false;$('#loginMsg').textContent=explain(e);await signOut(auth)}}
function syncStudent(){if(!window.studentMode)return;const name=$('#studentName').value.trim();$('#buzz').disabled=!connected||!studentGroup||!groups[studentGroup]||!studentWinnerReady||!name||round?.status!=='OPEN'||!!winner||studentPending||studentSent===round?.id;}
function paintStudent(){if(!window.studentMode)return;$('#studentGroup').textContent=groups[studentGroup]?.name||'Nhóm không còn trong lớp';$('#studentMsg').textContent=!groups[studentGroup]?'Hãy quét lại QR do giảng viên cung cấp.':!studentWinnerReady?'Đang đồng bộ lượt…':winner?(winner.uid===auth.currentUser?.uid?'Bạn đã giành quyền trả lời!':'Lượt đã có người giành quyền: '+winner.studentName+' — '+(groups[winner.group]?.name||'Nhóm')):round?.status==='OPEN'?'Nhập tên và bấm ngay khi muốn trả lời.':'Chờ giảng viên mở lượt trả lời.';syncStudent()}
async function startStudent(){ $('#teacherTemplate').remove();$('#login').remove();$('#teacherHeader').remove();$('#student').hidden=false;owner=params.get('room')||'';studentToken=params.get('token')||'';const idPattern=/^[A-Za-z0-9_-]{1,128}$/;if(!idPattern.test(owner)||!/^[a-f0-9]{36}$/.test(studentToken)){ $('#studentMsg').textContent='QR cũ hoặc không hợp lệ. Nhờ giảng viên tạo QR mới bằng bản V2.';return}try{let user=auth.currentUser;if(!user||!user.isAnonymous){if(user)await signOut(auth);user=(await signInAnonymously(auth)).user}const invite=await get(roomRef('invites/'+studentToken));studentGroup=invite.val();if(typeof studentGroup!=='string'||(params.has('group')&&params.get('group')!==studentGroup))throw Error('QR không hợp lệ hoặc nhóm đã bị thay đổi. Hãy quét lại QR của giảng viên.');await set(roomRef('members/'+user.uid),studentToken);
try{$('#studentName').value=sessionStorage.getItem('elsa-student-name')||''}catch{}$('#studentName').oninput=()=>{try{sessionStorage.setItem('elsa-student-name',$('#studentName').value)}catch{}syncStudent()};const fail=e=>{studentWinnerReady=false;$('#studentMsg').textContent=explain(e);syncStudent()};onValue(roomRef('groups'),s=>{groups=s.val()||{};paintStudent()},fail);onValue(roomRef('round'),s=>{const next=s.val();if(round?.id!==next?.id){if(winnerUnsubscribe)winnerUnsubscribe();winner=null;studentSent='';studentWinnerReady=false;round=next;if(next?.id)winnerUnsubscribe=onValue(roomRef('claims/'+next.id),w=>{winner=w.val();studentWinnerReady=true;paintStudent()},fail)}else round=next;paintStudent()},fail);
$('#buzz').onclick=async()=>{syncStudent();if($('#buzz').disabled)return;studentPending=true;const id=round.id;studentSent=id;syncStudent();$('#studentMsg').textContent='Đang gửi tín hiệu…';try{await set(roomRef('claims/'+id),{uid:user.uid,group:studentGroup,studentName:$('#studentName').value.trim(),timestamp:serverTimestamp()});if(round?.id===id)$('#studentMsg').textContent='Firebase đã xác nhận: bạn giành quyền trả lời!'}catch(e){if(round?.id===id){$('#studentMsg').textContent=/permission|PERMISSION/.test(e.code||'')?'Lượt đã khóa hoặc đã có người bấm trước. Chờ lượt tiếp theo.':explain(e)}}finally{studentPending=false;syncStudent()}};
}catch(e){$('#studentMsg').textContent=explain(e);syncStudent()}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginButton').disabled=true;$('#loginMsg').textContent='Đang đăng nhập…';try{await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value);$('#password').value=''}catch(err){$('#loginMsg').textContent=explain(err)}finally{$('#loginButton').disabled=false}};
$('#logout').onclick=async()=>{goOffline(db);await signOut(auth);location.reload()};
try{await setPersistence(auth,browserSessionPersistence);await auth.authStateReady();$('#boot').hidden=true;if(window.studentMode)await startStudent();else{onAuthStateChanged(auth,user=>{if(user&&!user.isAnonymous&&!teacherReady)startTeacher(user);else if(!user){$('#login').hidden=false;$('#teacherHeader').hidden=true}})}}catch(e){$('#boot').textContent=explain(e)}
</script></body></html>
